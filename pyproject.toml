[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thoth-node"
version = "0.1.0"
description = "Thoth — the ThothCraft installable node application (daemon + CLI on Whispy)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "whispy>=0.1.0",
    "click>=8.1",
    "websockets>=12.0",   # outbound Brain WS channel (CONTRACT §2)
    "zeroconf>=0.131",    # mDNS: advertise <name>.local on LAN binds
]

[project.scripts]
thoth = "thoth.cli.main:main"

[tool.setuptools.packages.find]
include = ["thoth*"]

# The built node dashboard ships inside the package so the node serves
# the same UI on :80 that the portal embeds over the relay (CONTRACT §5).
[tool.setuptools.package-data]
thoth = ["dashboard/dist/**/*"]
