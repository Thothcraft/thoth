{% extends "base.html" %}

{% block title %}Login - {{ super() }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <section class="auth-card">
    <div class="auth-card-head">
      <div class="auth-kicker">Thoth device</div>
      <h1>Sign in</h1>
      <p>Use the verified account created in thothHUB to connect this sensor.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="auth-card-body space-y-5">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <div>
        <label for="username">Username or verified email</label>
        <input id="username" name="username" autocomplete="username" required class="form-input" placeholder="you@example.com">
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="form-input" placeholder="Password">
      </div>
      <button type="submit" class="btn btn-primary w-full">Sign in</button>
    </form>
  </section>
</div>
{% endblock %}
