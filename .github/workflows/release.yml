name: Build & Release

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags like v1.0.0

permissions:
  contents: write      # Allow creating releases

jobs:
  # ── macOS ZIP archive (unsigned, no Apple Developer required) ─────────────
  build-mac-zip:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create macOS archive
        run: |
          zip -r Thoth-macOS.zip \
            thoth_core/ thoth_mac/ .env LICENSE README.md

      - name: Upload macOS ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip-release
          path: Thoth-macOS.zip

  # ── macOS DMG installer (requires Apple Developer signing) ───────────────
  build-mac-dmg:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Apple signing secrets
        run: |
          missing=0
          for v in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing required secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Apple signing/notarization secrets are required for a Gatekeeper-safe macOS installer."
            exit 1
          fi

      - name: Build GUI installer DMG
        run: |
          chmod +x thoth_mac/build_dmg.sh
          ./thoth_mac/build_dmg.sh

      - name: Import Developer ID certificate
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/apple-cert.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/apple-cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Codesign installer payload and DMG
        run: |
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "dist/macos-installer/Install Thoth.command"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "dist/Thoth-macOS-Installer.dmg"
          codesign --verify --deep --strict --verbose=2 "dist/Thoth-macOS-Installer.dmg"

      - name: Notarize and staple DMG
        run: |
          xcrun notarytool submit "dist/Thoth-macOS-Installer.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "dist/Thoth-macOS-Installer.dmg"
          spctl -a -t open --context context:primary-signature -v "dist/Thoth-macOS-Installer.dmg"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-release
          path: dist/Thoth-macOS-Installer.dmg

  # ── Windows archive ────────────────────────────────────────────────────
  build-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Windows archive
        run: |
          zip -r Thoth-Windows.zip \
            thoth_core/ thoth_win/ .env LICENSE README.md

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Thoth-Windows.zip

  # ── Raspberry Pi archive ───────────────────────────────────────────────
  build-rpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create RPi archive
        run: |
          tar czf Thoth-RPi.tar.gz \
            thoth_core/ thoth_rpi/ .env LICENSE README.md

      - name: Upload RPi artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-release
          path: Thoth-RPi.tar.gz

  # ── Burnable Raspberry Pi image ─────────────────────────────────────────
  build-rpi-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install pi-gen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync xz-utils \
            file git curl bc gpg pigz xxd arch-test bmap-tools kmod
          sudo modprobe binfmt_misc || true

      - name: Fetch pi-gen
        run: |
          git clone --depth 1 --branch arm64 https://github.com/RPi-Distro/pi-gen.git /tmp/pi-gen

      - name: Add Thoth image stage
        run: |
          rsync -a thoth_rpi/pi-gen/stage-thoth/ /tmp/pi-gen/stage-thoth/
          chmod +x /tmp/pi-gen/stage-thoth/00-install/00-run.sh
          chmod +x /tmp/pi-gen/stage-thoth/00-install/01-run-chroot.sh

      - name: Configure pi-gen
        run: |
          cat > /tmp/pi-gen/config << EOF
          IMG_NAME='Thoth-RPi'
          PI_GEN_RELEASE='Thoth'
          RELEASE='trixie'
          TARGET_HOSTNAME='thoth'
          FIRST_USER_NAME='pi'
          FIRST_USER_PASS='thoth'
          DISABLE_FIRST_BOOT_USER_RENAME=1
          ENABLE_SSH=1
          PASSWORDLESS_SUDO=1
          WPA_COUNTRY='US'
          DEPLOY_COMPRESSION='gz'
          COMPRESSION_LEVEL=6
          STAGE_LIST='stage0 stage1 stage2 stage-thoth'
          REPO_DIR='${{ github.workspace }}'
          EOF

      - name: Build Thoth Raspberry Pi image
        working-directory: /tmp/pi-gen
        run: sudo ./build.sh

      - name: Collect image artifact
        run: |
          find /tmp/pi-gen/deploy -maxdepth 1 -type f -print
          image="$(find /tmp/pi-gen/deploy -maxdepth 1 -type f -name '*Thoth-RPi*.img.gz' | head -n 1)"
          if [ -z "$image" ]; then
            echo "No Thoth-RPi .img.gz produced"
            exit 1
          fi
          version="${GITHUB_REF_NAME}"
          cp "$image" Thoth-RPi.img.gz
          cp "$image" "Thoth-RPi-${version}.img.gz"

      - name: Upload RPi image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-image-release
          path: |
            Thoth-RPi.img.gz
            Thoth-RPi-*.img.gz

  # ── Create GitHub Release ──────────────────────────────────────────────
  release:
    needs: [build-mac-zip, build-win, build-rpi, build-rpi-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/macos-zip-release/Thoth-macOS.zip
            release-assets/windows-release/Thoth-Windows.zip
            release-assets/rpi-release/Thoth-RPi.tar.gz
            release-assets/rpi-image-release/Thoth-RPi.img.gz
            release-assets/rpi-image-release/Thoth-RPi-*.img.gz
          body: |
            ## Thoth ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Install |
            |----------|------|---------|
            | **macOS** | `Thoth-macOS.zip` | Extract → `cd thoth_mac && ./install.sh` |
            | **Windows** | `Thoth-Windows.zip` | Extract → `cd thoth_win && powershell -ExecutionPolicy Bypass -File install.ps1` |
            | **Raspberry Pi image** | `Thoth-RPi-${{ github.ref_name }}.img.gz` / `Thoth-RPi.img.gz` | Burn with Raspberry Pi Imager. Set username `pi`, hostname `thoth`, WiFi, and SSH in advanced settings. |
            | **Raspberry Pi bundle** | `Thoth-RPi.tar.gz` | Extract → `sudo ./thoth_rpi/setup/install.sh` |

            ### What's New
            See commit history for details.
