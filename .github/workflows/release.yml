name: Build & Release

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags like v1.0.0

permissions:
  contents: write      # Allow creating releases

jobs:
  # ── macOS archive ───────────────────────────────────────────────────────
  build-mac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create macOS archive
        run: |
          tar czf Thoth-macOS.tar.gz \
            thoth_core/ thoth_mac/ .env LICENSE README.md

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: Thoth-macOS.tar.gz

  # ── Windows archive ────────────────────────────────────────────────────
  build-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Windows archive
        run: |
          zip -r Thoth-Windows.zip \
            thoth_core/ thoth_win/ .env LICENSE README.md

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Thoth-Windows.zip

  # ── Raspberry Pi archive ───────────────────────────────────────────────
  build-rpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create RPi archive
        run: |
          tar czf Thoth-RPi.tar.gz \
            thoth_core/ thoth_rpi/ .env LICENSE README.md

      - name: Upload RPi artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-release
          path: Thoth-RPi.tar.gz

  # ── Create GitHub Release ──────────────────────────────────────────────
  release:
    needs: [build-mac, build-win, build-rpi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/macos-release/Thoth-macOS.*
            release-assets/windows-release/Thoth-Windows.zip
            release-assets/rpi-release/Thoth-RPi.tar.gz
          body: |
            ## Thoth ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Install |
            |----------|------|---------|
            | **macOS** | `Thoth-macOS.tar.gz` | Extract → `cd thoth_mac && ./install.sh` |
            | **Windows** | `Thoth-Windows.zip` | Extract → `cd thoth_win && powershell -ExecutionPolicy Bypass -File install.ps1` |
            | **Raspberry Pi** | `Thoth-RPi.tar.gz` | Extract → `sudo ./thoth_rpi/setup/install.sh` |

            ### What's New
            See commit history for details.
