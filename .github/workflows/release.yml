name: Build & Release

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags like v1.0.0

permissions:
  contents: write      # Allow creating releases

jobs:
  # ── macOS .dmg ─────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r thoth_core/requirements.txt
          pip install -r thoth_mac/requirements.txt
          pip install py2app

      - name: Build .app bundle
        working-directory: thoth_mac
        run: python setup_app.py py2app

      - name: Generate .icns icon
        working-directory: thoth_mac
        run: |
          mkdir -p Thoth.iconset
          sips -z 16 16   icon.png --out Thoth.iconset/icon_16x16.png
          sips -z 32 32   icon.png --out Thoth.iconset/icon_16x16@2x.png
          sips -z 128 128 icon.png --out Thoth.iconset/icon_128x128.png
          sips -z 256 256 icon.png --out Thoth.iconset/icon_128x128@2x.png
          sips -z 256 256 icon.png --out Thoth.iconset/icon_256x256.png
          sips -z 512 512 icon.png --out Thoth.iconset/icon_256x256@2x.png
          sips -z 512 512 icon.png --out Thoth.iconset/icon_512x512.png
          iconutil -c icns Thoth.iconset -o Thoth.icns || true
          rm -rf Thoth.iconset

      - name: Create DMG
        working-directory: thoth_mac
        run: |
          if [ -d "dist/Thoth.app" ]; then
            hdiutil create -volname Thoth -srcfolder dist/Thoth.app \
              -ov -format UDZO dist/Thoth-macOS-${GITHUB_REF_NAME}.dmg
          else
            echo "::warning::py2app build did not produce Thoth.app — creating source archive instead"
            cd .. && tar czf thoth_mac/dist/Thoth-macOS-${GITHUB_REF_NAME}.tar.gz \
              thoth_core/ thoth_mac/ .env LICENSE README.md
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: thoth_mac/dist/Thoth-macOS-*

  # ── Windows .exe ───────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r thoth_core/requirements.txt
          pip install -r thoth_win/requirements.txt
          pip install pyinstaller Pillow

      - name: Convert icon
        working-directory: thoth_win
        run: |
          python -c "from PIL import Image; img=Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build with PyInstaller
        working-directory: thoth_win
        run: |
          pyinstaller --name Thoth --icon icon.ico --noconsole `
            --add-data "..\thoth_core\backend\templates;thoth_core\backend\templates" `
            --add-data "..\thoth_core\backend\static;thoth_core\backend\static" `
            --add-data "..\.env;." `
            --add-data "icon.png;." `
            --paths ".." `
            --hidden-import "thoth_core.backend.app" `
            --hidden-import "thoth_core.backend.routes.files" `
            --hidden-import "thoth_core.sensors" `
            --hidden-import "thoth_win.sensors" `
            --hidden-import "engineio.async_drivers.threading" `
            app.py

      - name: Create ZIP
        working-directory: thoth_win
        run: Compress-Archive -Path dist\Thoth\* -DestinationPath dist\Thoth-Windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: thoth_win/dist/Thoth-Windows-*.zip

  # ── Raspberry Pi source archive ────────────────────────────────────────
  build-rpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create RPi source archive
        run: |
          tar czf Thoth-RPi-${GITHUB_REF_NAME}.tar.gz \
            thoth_core/ thoth_rpi/ .env LICENSE README.md

      - name: Upload RPi artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-release
          path: Thoth-RPi-*.tar.gz

  # ── Create GitHub Release ──────────────────────────────────────────────
  release:
    needs: [build-mac, build-win, build-rpi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/macos-release/*
            release-assets/windows-release/*
            release-assets/rpi-release/*
          body: |
            ## Thoth ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Install |
            |----------|------|---------|
            | **macOS** | `Thoth-macOS-${{ github.ref_name }}.dmg` | Open DMG → drag to Applications |
            | **Windows** | `Thoth-Windows-${{ github.ref_name }}.zip` | Extract → run `Thoth.exe` |
            | **Raspberry Pi** | `Thoth-RPi-${{ github.ref_name }}.tar.gz` | Extract → `sudo ./thoth_rpi/setup/install.sh` |

            ### What's New
            See commit history for details.
